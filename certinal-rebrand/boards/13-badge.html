<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body { background: radial-gradient(90% 70% at 50% 40%, #f6f8f5, #dce2db); }
.strap { position: absolute; left: 50%; top: -40px; width: 150px; height: 560px; transform: translateX(-50%); background: var(--g1); display: flex; flex-direction: column; align-items: center; justify-content: space-around; box-shadow: inset -20px 0 30px rgb(0 0 0 / .12); }
.strap span { writing-mode: vertical-rl; font-family: var(--mono); font-size: 26px; letter-spacing: .3em; color: var(--black); }
.clip { position: absolute; left: 50%; top: 500px; width: 120px; height: 90px; transform: translateX(-50%); background: linear-gradient(#cfd4d0, #8e9490); border-radius: 18px; }
.badge { position: absolute; left: 50%; top: 560px; width: 820px; height: 1240px; transform: translateX(-50%) rotate(-3deg); background: var(--black); border-radius: 48px; overflow: hidden; box-shadow: 0 2px 0 #333 inset, 40px 80px 140px rgb(20 40 25 / .35); }
.badge .slot { position: absolute; left: 50%; top: 40px; width: 160px; height: 34px; transform: translateX(-50%); background: #dfe4de; border-radius: 20px; }
.badge .r { position: absolute; left: 0; right: 0; bottom: 0; height: 560px; --cx: 100%; --cy: 100%; }
.badge img { position: absolute; left: 70px; top: 150px; width: 380px; }
.role { position: absolute; left: 70px; top: 330px; font-size: 96px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; }
.meta { position: absolute; left: 70px; top: 460px; font-family: var(--mono); font-size: 26px; letter-spacing: .1em; color: rgb(255 255 255 / .55); }
</style>
<body class="portrait">
<div class="strap"><span>CERTINAL</span><span>CERTINAL</span></div><div class="clip"></div>
<div class="badge"><div class="slot"></div><img class="logo-white" src="../assets/certinal-logo-colour.svg"><p class="role">Event<br>pass</p><p class="meta">ALL ACCESS</p><div class="r rings"></div></div>
<p class="corner tl label" style="color:rgb(20 20 20/.5)">Event badge · <b style="color:var(--g1)">Mockup</b></p>
</body>
