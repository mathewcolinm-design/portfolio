<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
.tiles { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; gap: 70px; }
.tile { width: 560px; height: 560px; border-radius: 126px; display: grid; place-items: center; box-shadow: 0 60px 120px rgb(0 0 0 / .45), inset 0 2px 0 rgb(255 255 255 / .12); }
.tile img { width: 330px; }
.glow { position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px; transform: translate(-50%,-50%); background: radial-gradient(circle, rgb(1 180 109 / .35), transparent 60%); }
</style>
<body class="portrait">
<div class="grid"></div><div class="glow"></div>
<div class="tiles" style="grid-template-columns: 1fr 1fr;">
  <div class="tile" style="background:#fff"><img src="../assets/certinal-icon-colour.svg"></div>
  <div class="tile" style="background:var(--black)"><img class="logo-white" src="../assets/certinal-icon-colour.svg"></div>
  <div class="tile" style="background:var(--g1)"><img class="logo-white" src="../assets/certinal-icon-colour.svg"></div>
  <div class="tile rings" style="--cx:100%;--cy:0%"><img class="logo-white" src="../assets/certinal-icon-colour.svg"></div>
</div>
<p class="corner tl label">App icons · <b>White, black, green</b></p>
<p class="corner bl label">Full-bleed tiles for avatars, listings and favicons</p>
</body>
