<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body { background: var(--g1); }
.bg { position: absolute; inset: 0; --cx: 0%; --cy: 100%; --r1: 10%; --r2: 22%; --r3: 34%; --r4: 47%; --r5: 62%; }
.phone { position: absolute; left: 50%; top: 50%; width: 820px; height: 1700px; transform: translate(-50%, -50%) rotate(-6deg); background: #0b0d0c; border-radius: 130px; padding: 30px; box-shadow: 0 0 0 4px #333, 0 90px 160px rgb(0 0 0 / .35); }

.notch { position: absolute; left: 50%; top: 56px; width: 220px; height: 64px; background: #0b0d0c; border-radius: 40px; transform: translateX(-50%); }

<body class="portrait">
<div class="bg rings"></div>
<div class="phone"><div class="s"><img src="../assets/web/home-mobile.png"></div><div class="notch"></div></div>
