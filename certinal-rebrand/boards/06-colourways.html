<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body { display: grid; grid-template-columns: repeat(4, 1fr); }
.c { position: relative; display: grid; place-items: center; }
.c img { width: 400px; }
.c .label { position: absolute; left: 40px; bottom: 56px; line-height: 1.6; }
</style>
<body class="landscape">
<div class="c" style="background:#fff"><img src="../assets/certinal-logo-colour.svg"><p class="label" style="color:rgb(20 20 20/.6)">Full colour<br>on white</p></div>
<div class="c" style="background:var(--g6)"><img class="logo-black" src="../assets/certinal-logo-colour.svg"><p class="label" style="color:rgb(20 20 20/.6)">Black<br>on lime</p></div>
<div class="c" style="background:var(--g1)"><img class="logo-white" src="../assets/certinal-logo-colour.svg"><p class="label" style="color:rgb(255 255 255/.8)">White<br>on green</p></div>
<div class="c" style="background:var(--black)"><img class="logo-white" src="../assets/certinal-logo-colour.svg"><p class="label">White<br>on black</p></div>
</body>
