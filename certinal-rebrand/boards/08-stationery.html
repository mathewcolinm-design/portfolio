<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body { background: radial-gradient(120% 90% at 40% 30%, #f4f6f3, #dfe4de); }
.scene { position: absolute; left: 50%; top: 52%; width: 1900px; height: 1300px; transform: translate(-50%, -50%) perspective(5000px) rotateX(50deg) rotateZ(-28deg); transform-style: preserve-3d; }
.o { position: absolute; border-radius: 6px; box-shadow: 0 2px 2px rgb(0 0 0 / .08), 30px 50px 80px rgb(20 40 25 / .22); overflow: hidden; }
.paper { background: #fff; }
.lines div { height: 10px; border-radius: 5px; background: #e6e9e5; margin-bottom: 18px; }
.mono { font-family: var(--mono); font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
</style>
<body class="landscape">
<div class="scene">
  <!-- Letterhead -->
  <div class="o paper" style="left:0; top:80px; width:820px; height:1160px; padding:80px">
    <img src="../assets/certinal-logo-colour.svg" style="width:300px">
    <div class="lines" style="margin-top:160px; width:560px"><div></div><div style="width:80%"></div><div></div><div style="width:65%"></div></div>
    <div class="lines" style="margin-top:60px; width:600px"><div></div><div></div><div style="width:90%"></div><div></div><div style="width:40%"></div></div>
    <div class="rings" style="position:absolute; right:0; bottom:0; width:420px; height:420px; --cx:100%; --cy:100%; --r1:14%; --r2:28%; --r3:42%; --r4:57%; --r5:72%; -webkit-mask: radial-gradient(circle at 100% 100%, #000 0 72%, transparent 72.4%)"></div>
    <p class="mono" style="position:absolute; left:80px; bottom:64px; color:#8a8f89">certinal.com</p>
  </div>
  <!-- Business card front -->
  <div class="o rings" style="left:930px; top:120px; width:700px; height:400px; --cx:100%; --cy:0%">
    <img class="logo-white" src="../assets/certinal-logo-colour.svg" style="position:absolute; left:60px; bottom:60px; width:360px">
  </div>
  <!-- Business card back -->
  <div class="o paper" style="left:1000px; top:600px; width:700px; height:400px; padding:56px">
    <img src="../assets/certinal-icon-colour.svg" style="width:90px">
    <div class="lines" style="position:absolute; left:56px; bottom:44px; width:300px"><div style="background:#cfd5ce"></div><div style="width:70%"></div></div>
    <p class="mono" style="position:absolute; right:56px; bottom:56px; color:#8a8f89">certinal.com</p>
  </div>
  <!-- Envelope -->
  <div class="o paper" style="left:1060px; top:1080px; width:900px; height:450px; padding:56px; background:#fbfcfa">
    <img src="../assets/certinal-logo-colour.svg" style="width:260px">
    <div style="position:absolute; left:0; right:0; bottom:0; height:16px; background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g5),var(--g6))"></div>
  </div>
</div>
<p class="corner tl label" style="color:rgb(20 20 20/.5)">Stationery · <b style="color:var(--g1)">Mockup</b></p>
</body>
