<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body { background: var(--g6); }
.card { position: absolute; left: 50%; top: 50%; width: 1080px; transform: translate(-50%, -50%); background: var(--black); border-radius: 64px; overflow: hidden; box-shadow: 0 80px 160px rgb(40 70 0 / .35); }
.banner { height: 420px; --cx: 100%; --cy: 0%; }
.avatar { position: absolute; left: 72px; top: 300px; width: 240px; height: 240px; border-radius: 56px; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 10px var(--black); }
.avatar img { width: 150px; }
.body { padding: 170px 72px 72px; }
.name { font-size: 64px; font-weight: 600; letter-spacing: -0.02em; }
.handle { font-family: var(--mono); font-size: 26px; color: rgb(255 255 255 / .5); margin-top: 6px; }
.bio { font-size: 36px; line-height: 1.4; color: rgb(255 255 255 / .85); margin-top: 36px; max-width: 26ch; }
.btn { position: absolute; right: 72px; top: 460px; background: #fff; color: var(--black); font-size: 30px; font-weight: 600; padding: 22px 48px; border-radius: 60px; }
.link { font-family: var(--mono); font-size: 26px; color: var(--g6); margin-top: 36px; }
</style>
<body class="portrait">
<div class="card">
  <div class="banner rings"></div>
  <div class="avatar"><img src="../assets/certinal-icon-colour.svg"></div>
  <span class="btn">Follow</span>
  <div class="body"><p class="name">Certinal</p><p class="bio">Consent and compliance, built for the DPDP Act.</p><p class="link">certinal.com</p></div>
</div>
<p class="corner tl label" style="color:rgb(20 20 20/.55)">Social profile · <b style="color:#0b3d25">Mockup</b></p>
</body>
