# Design process (How I work page) ─────────────────────────────────
# The stages, in order. "loop: true" marks the stages that repeat until
# the design holds up; they're drawn together as one loop.
process_intro: Every project starts with a problem, not a screen. I work in rounds, and the rounds only stop when real people can use the thing without help.
process:
  - name: Understand the problem
    line: Who is this for, what are they trying to do, and where does it hurt? I talk to users and map the journey as it is today, friction and all.
    methods: [User interviews, Surveys, Journey mapping]
  - name: Define what matters
    line: I turn what I learned into a clear problem statement and a few rules the design has to meet, and agree them with product and engineering before drawing anything.
    methods: [Problem framing, Information architecture]
  - name: Explore ideas
    line: Many rough options before one polished one. Sketches, flows and wireframes, compared side by side so the best idea wins, not the first.
    methods: [User flows, Wireframing]
  - name: Design
    line: The chosen direction becomes real screens, built on a design system so every state, edge case and screen size holds together.
    methods: [Visual design, Design systems, Accessibility]
    loop: true
  - name: Prototype
    line: Interactive prototypes in Figma or Framer, close enough to the real thing that people react honestly.
    methods: [Prototyping, Interaction design]
    loop: true
  - name: Test
    line: Usability tests with real people. Wherever they hesitate, I go back to the design and try again.
    methods: [Usability testing, Maze]
    loop: true
  - name: Ship and hand off
    line: Clean specs and components engineering can build from directly, then I watch how it's used and feed that into the next round.
    methods: [Design-to-dev handoff, Agile]

